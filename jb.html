<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TECHNOMIC ALZAEEM</title>
    <style>

html,body{margin:0;padding:0;min-height:100%;background:#03050a url("huntercenter_wallpaper.png") center center/cover fixed no-repeat;color:#eef4ff;font:15px/1.5 "Segoe UI",system-ui,sans-serif;overflow:hidden}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.62),rgba(0,7,18,.78));pointer-events:none}
#brand{position:relative;z-index:2;text-align:center;padding:12px 16px;background:rgba(2,7,14,.84);border-bottom:1px solid rgba(25,150,255,.42);box-shadow:0 5px 25px rgba(0,0,0,.35)}
#brand img{width:74px;height:58px;object-fit:contain;margin-right:12px;vertical-align:middle;filter:drop-shadow(0 0 12px rgba(0,150,255,.35))}
#brand b{font-size:21px;font-weight:800;letter-spacing:.09em;color:#fff;vertical-align:middle;text-shadow:0 0 16px rgba(0,153,255,.5)}
#spin{position:fixed;z-index:2;top:calc(50% + 18px);left:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border:4px solid rgba(255,255,255,.13);border-top-color:#159cff;border-right-color:#69d5ff;border-radius:50%;animation:spin .85s linear infinite;box-shadow:0 0 24px rgba(0,153,255,.4)}
#spin:after{content:"";position:absolute;inset:9px;border:2px solid rgba(255,255,255,.12);border-bottom-color:#fff;border-radius:50%;animation:spin .6s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
#msg{position:fixed;z-index:2;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;font-size:18px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:rgba(3,10,20,.78);border:1px solid rgba(21,156,255,.55);border-radius:18px;padding:20px 30px;box-shadow:0 0 35px rgba(0,126,255,.2);display:none}
#wrap{padding:0}#state,#out{display:none}
body.done #spin,body.fail #spin{display:none}body.fail #msg{display:block}
body.log #spin,body.log #msg{display:none}body.log #wrap{position:relative;z-index:2;padding:18px}.log #state{display:block;font-size:22px;font-weight:800;margin:0 0 10px}.log #out{display:block;white-space:pre-wrap;font:12px/1.45 Consolas,monospace;background:rgba(4,8,14,.9);border:1px solid rgba(35,157,255,.4);border-radius:14px;padding:12px;height:calc(100vh - 150px);overflow-y:auto;box-shadow:0 0 30px rgba(0,126,255,.12)}
.ok,.safe{color:#7ee8b0}.bad,.danger{color:#ff7f8f}.warn{color:#ffd36b}code{color:#9fd2ff}
@media(max-width:600px){#brand b{font-size:17px}#brand img{width:58px;height:46px}#msg{font-size:15px;white-space:nowrap;padding:16px 20px}}

</style>
  </head>
  <body>
    <div id="brand"><img src="huntercenter_logo.png" alt="Hunter Center Libya"><b>TECHNOMIC ALZAEEM</b></div>
    <div id="spin"></div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script type="module">
      import "./jb.js?v=10";
    </script>
  </body>
</html>
